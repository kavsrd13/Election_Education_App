steps:
  # Step 1: Build the Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/promptwatvirtual/election-journey:$COMMIT_SHA'
      - '-t'
      - 'gcr.io/promptwatvirtual/election-journey:latest'
      - '--build-arg'
      - 'VITE_GEMINI_API_KEY=$$VITE_GEMINI_API_KEY'
      - '.'
    secretEnv: ['VITE_GEMINI_API_KEY']

  # Step 2: Push the image to Container Registry
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/promptwatvirtual/election-journey:$COMMIT_SHA'

  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/promptwatvirtual/election-journey:latest'

  # Step 3: Deploy to Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - 'run'
      - 'deploy'
      - 'election-journey'
      - '--image=gcr.io/promptwatvirtual/election-journey:$COMMIT_SHA'
      - '--region=us-central1'
      - '--platform=managed'
      - '--allow-unauthenticated'
      - '--port=8080'
      - '--memory=512Mi'
      - '--cpu=1'
      - '--min-instances=0'
      - '--max-instances=3'
      - '--set-env-vars=VITE_GEMINI_API_KEY=$$VITE_GEMINI_API_KEY'

availableSecrets:
  secretManager:
    - versionName: projects/promptwatvirtual/secrets/VITE_GEMINI_API_KEY/versions/latest
      env: 'VITE_GEMINI_API_KEY'

images:
  - 'gcr.io/promptwatvirtual/election-journey:$COMMIT_SHA'
  - 'gcr.io/promptwatvirtual/election-journey:latest'

options:
  logging: CLOUD_LOGGING_ONLY
